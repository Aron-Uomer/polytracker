# Render Blueprint for the Whole Record API (Express server in server/).
# In Render: New → Blueprint → point at this repo. Set the secret env vars
# (marked sync:false) in the dashboard after the service is created.
services:
  - type: web
    # Deliberately still `polytrack-api` after the rename to Whole Record.
    # Render identifies services by name: changing it here does not rename the
    # existing service, it provisions a NEW one on a NEW hostname. That would
    # mean updating API_PUBLIC_URL, CORS_ORIGIN, APP_URL and Vercel's
    # VITE_API_BASE in lockstep, re-adding the origin in Google Cloud Console,
    # and re-pointing the NOWPayments IPN callback — with payments silently
    # failing to grant Pro in the window where they disagree.
    #
    # The name is internal; nothing a visitor sees contains it. Rename it only
    # as a deliberate migration, not as part of a find-and-replace.
    name: polytrack-api
    runtime: node
    rootDir: server
    plan: free
    # --include=dev is required: NODE_ENV=production makes npm skip devDependencies,
    # but the build needs TypeScript + @types/* to compile.
    #
    # `migrate deploy`, never `db push`: db push reconciles drift by altering and
    # dropping, which on a database holding real users is a data-loss waiting to
    # happen. migrate deploy only applies committed, reviewed migration files and
    # refuses anything it does not recognise.
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NOWPAYMENTS_API_URL
        value: https://api.nowpayments.io/v1
      # --- set these in the Render dashboard (Environment tab) ---
      - key: DATABASE_URL # your Neon connection string
        sync: false
      - key: AUTH_SECRET # a long random string
        sync: false
      - key: CORS_ORIGIN # your Vercel frontend URL, e.g. https://wholerecord.vercel.app
        sync: false
      - key: APP_URL # same as CORS_ORIGIN (used for checkout redirects)
        sync: false
      - key: API_PUBLIC_URL # this service's public URL, e.g. https://polytrack-api.onrender.com
        sync: false
      - key: GOOGLE_CLIENT_ID # optional, for Google sign-in
        sync: false
      - key: NOWPAYMENTS_API_KEY # optional, for crypto billing
        sync: false
      - key: NOWPAYMENTS_IPN_SECRET # optional, for crypto billing
        sync: false
