<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14150F" />
    <meta
      name="description"
      content="See any Polymarket trader's real stats — win rate, P&L, volume, positions and a full breakdown by wallet address."
    />
    <link
      rel="preload"
      href="/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/martianmono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Whole Record: Polymarket Trader Stats</title>
    <!--
      Applied before first paint, so a visitor who chose daylight never sees
      the dark board flash first. Dark is the absence of the attribute, which
      is why this only ever has to add one — and why the default costs nothing.
      Kept inline and tiny on purpose: a deferred module would run after paint,
      which is the whole bug this avoids.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("wr_theme");
          var light =
            saved === "light" ||
            (!saved &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) {
            document.documentElement.setAttribute("data-theme", "light");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#EFEADE");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!--
      impeccable direction contract · seed d086c314

      THESIS: A public board that ranks the runners and settles on a number.
      Discovery IS the page. Refuses the centered-headline-over-glass-cards

      FIRST VIEWPORT: Full-bleed board. Header rail with plate-set wordmark;
      ranked rows of coded wallets that flip once and stop; the address slot
      inlaid into the chassis, amber-lit, primary action at the rail's right.

      FORM: Totalisator board — candidate 4 of 7 grounded, assigned by seed
      d086c314.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
