<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PolyTrack">
  <!-- The PT plate from the rail: enamel chassis, bone frame, bone lettering.
       Letters are drawn as rects rather than <text> so the mark is identical
       on every platform and stays crisp at 16px — a favicon cannot depend on
       Archivo being installed. -->
  <rect width="32" height="32" fill="#14150F"/>
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#E8E3D6" stroke-width="2"/>

  <g fill="#E8E3D6">
    <!-- P -->
    <rect x="6" y="10" width="3.4" height="13"/>
    <rect x="6" y="10" width="7.6" height="3.4"/>
    <rect x="10.2" y="10" width="3.4" height="6.6"/>
    <rect x="6" y="13.2" width="7.6" height="3.4"/>
    <!-- T -->
    <rect x="15.8" y="10" width="10.2" height="3.4"/>
    <rect x="19.2" y="10" width="3.4" height="13"/>
  </g>
</svg>
